[package]
name = "nanosol"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
license = "MIT"
description = "Small, auditable Solana primitives for ZeroClaw WASM tool plugins"
repository = "https://github.com/Fianko-codes/zeroclaw-solana"
documentation = "https://docs.rs/nanosol"
readme = "README.md"
keywords = ["solana", "wasm", "wasip2", "spl-token", "zeroclaw"]
categories = ["cryptography::cryptocurrencies", "wasm", "encoding"]
exclude = ["target/"]

[lib]
crate-type = ["rlib"]

[dependencies]
base64 = "0.22"
bs58 = "0.5"
curve25519-dalek = { version = "4", default-features = false, features = ["alloc"] }
sha2 = "0.10"
serde_json = "1"

[dev-dependencies]
bincode = "=1.3.3"
solana-compute-budget-interface = "=3.0.0"
solana-hash = "=4.5.0"
solana-instruction = "=3.4.0"
solana-message = { version = "=4.3.0", features = ["serde"] }
solana-nonce = { version = "=3.2.0", features = ["serde"] }
solana-program-pack = "=3.1.0"
solana-pubkey = { version = "=4.2.0", features = ["curve25519"] }
solana-sdk-ids = "=3.1.0"
solana-sha256-hasher = { version = "=3.1.0", features = ["sha2"] }
solana-short-vec = "=3.2.2"
solana-system-interface = { version = "=3.2.0", features = ["bincode"] }
solana-transaction = { version = "=4.1.5", features = ["serde"] }
spl-associated-token-account-interface = "=2.0.0"
spl-memo-interface = "=2.1.0"
spl-token-2022-interface = "=3.1.1"
spl-token-interface = "=3.0.0"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1

[workspace]
