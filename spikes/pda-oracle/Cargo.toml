[package]
name = "solana-pda-oracle-spike"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Milestone 0 independent Solana PDA, ATA, and compact-u16 implementation checked against official crates"
publish = false

[dependencies]
bs58 = "0.5"
curve25519-dalek = { version = "4", default-features = false, features = ["alloc"] }
sha2 = "0.10"

[dev-dependencies]
bincode = "1.3.3"
solana-pubkey = { version = "=3.0.0", features = ["curve25519"] }
solana-short-vec = "=3.2.2"
spl-associated-token-account-interface = "=2.0.0"

[workspace]

