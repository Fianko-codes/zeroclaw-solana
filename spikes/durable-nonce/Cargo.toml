[package]
name = "durable-nonce-spike"
version = "0.0.0"
edition = "2021"
publish = false
description = "M4 Phase-A protocol spike: prove durable-nonce assumptions against official crates before touching production."

[dependencies]
nanosol = { path = "../../nanosol" }
base64 = "0.22"
bs58 = "0.5"
serde_json = "1"
ed25519-dalek = "2"

[dev-dependencies]
bincode = "=1.3.3"
solana-nonce = { version = "=3.2.0", features = ["serde"] }
solana-system-interface = { version = "=3.2.0", features = ["bincode"] }
solana-sdk-ids = "=3.1.0"
solana-pubkey = "=4.2.0"
solana-hash = "=4.5.0"
solana-instruction = "=3.4.0"
solana-message = { version = "=4.3.0", features = ["serde"] }
solana-transaction = { version = "=4.1.5", features = ["serde"] }
solana-fee-calculator = "*"
solana-sha256-hasher = { version = "*", features = ["sha2"] }

[[example]]
name = "print_layout"

[workspace]
